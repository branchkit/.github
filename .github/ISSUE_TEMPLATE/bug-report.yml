name: Bug report
description: An SDK, the CLI, or their docs did something wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem, such as a way around the sandbox or a permission check? Please report it privately from this repository's **Security** tab, not here.

  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest code, manifest or command that shows it.
      render: text
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: SDK or CLI version, and your OS.
      placeholder: "plugin-sdk-go v0.13.0, macOS 15.4"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Optional. `branchkit-cli dev plog <plugin-id>` prints your plugin's log.
      render: text
